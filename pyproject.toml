[project]
name = "basis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.69",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", ".git", "__pycache__", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.src]
include = ["scripts"]
