name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm check
      - run: nix develop -c pnpm test
      - run: nix develop .#browser -c pnpm browser:check

  sustained:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASIS_SEQUENCE_RUNS: "1000"
      BASIS_SEQUENCE_SEED: ${{ github.run_number }}
      BASIS_BENCH_OUTPUT_DIR: /tmp/basis-performance
      # Shared runner timings are advisory; correctness/resource assertions fail.
      BASIS_PERF_ENFORCE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm test
      - run: nix develop -c pnpm perf:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance
          path: /tmp/basis-performance
          if-no-files-found: warn
